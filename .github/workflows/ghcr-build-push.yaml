name: Build and push image to GHCR

# ModernPath fork build. Publishes the argocd-image-updater image (including the
# SourceHydrator support patch) to GitHub Container Registry using the built-in
# GITHUB_TOKEN — no external registry credentials required.

on:
  workflow_dispatch:
  push:
    branches:
      - fix/source-hydrator-support

jobs:
  build-push:
    name: Build and push (linux/amd64)
    # Guard so this never runs on the upstream repo if the branch is ever pushed there.
    if: github.repository == 'ModernPath/argocd-image-updater'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Compute image name (lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=source-hydrator
            type=sha,prefix=source-hydrator-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
